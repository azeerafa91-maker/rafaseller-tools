<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RafaSeller Tools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      padding: 20px;
      margin: 0;
    }

    .kartu {
      max-width: 420px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 12px #00000015;
    }

    h1 {
      text-align: center;
      color: #1769aa;
    }

    p {
      text-align: center;
      color: #555;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #e8f4ff;
      border-radius: 8px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <h1>RafaSeller Tools</h1>
    <p>Kalkulator Keuntungan Penjual</p>

    <label>Modal Produk (Rp)</label>
    <input id="modal" type="number" placeholder="Contoh: 35000">

    <label>Harga Jual (Rp)</label>
    <input id="harga" type="number" placeholder="Contoh: 70000">

    <label>Biaya Platform (%)</label>
    <input id="biaya" type="number" value="10" min="0" max="100" step="0.1">

    <label>Biaya Tambahan (Rp)</label>
    <input id="tambahan" type="number" value="2000" min="0">

    <button onclick="hitungUntung()">Hitung Keuntungan</button>

    <div id="hasil">Hasil perhitungan akan muncul di sini.</div>
  </div>

<div class="kartu">
  <h2>Dashboard RafaSeller</h2>

  <p>Total Produk: <span id="totalProduk">0</span></p>

  <p>Total Stok: <span id="totalStok">0</span></p>
</div>
  
<h2>Stok Produk</h2>

<label>Pilih jenis transaksi:</label>
<select id="jenisTransaksi">
  <option value="masuk">Barang Masuk</option>
  <option value="keluar">Barang Terjual</option>
</select>

<br><br>

<label>Pilih produk:</label>
<select id="pilihProduk"></select>

<br><br>

<label>Jumlah barang:</label>
<input type="number" id="jumlahStok" min="1" placeholder="Masukkan jumlah">

<br><br>

<button onclick="prosesStok()">Proses Stok</button>

  
<input
  type="text"
  id="cariProduk"
  placeholder="Cari nama produk..."
>
<div id="daftarStok"></div>
  
  <hr>

<h2>Perbandingan Keuntungan Produk</h2>
<p>Bandingkan keuntungan beberapa produk.</p>

<label>Nama Produk</label>
<input id="namaProduk" type="text" placeholder="Contoh: Kaos">

<label>Modal Produk (Rp)</label>
<input id="modalBanding" type="number" placeholder="35000">

<label>Harga Jual (Rp)</label>
<input id="hargaBanding" type="number" placeholder="70000">

<label>Biaya Platform (%)</label>
<input id="biayaBanding" type="number" value="10">

<label>Biaya Tambahan (Rp)</label>
<input id="tambahanBanding" type="number" value="2000">

<button onclick="bandingkanProduk()">
  Tambahkan & Bandingkan
</button>

<div id="hasilBanding"
     data-produk=""
     style="margin-top:20px; padding:15px; background:#e8f4ff; border-radius:8px;">
  Hasil perbandingan akan muncul di sini.
</div>

  <script>
    function hitungUntung() {
      let modal = Number(document.getElementById("modal").value);
      let harga = Number(document.getElementById("harga").value);
      let biaya = Number(document.getElementById("biaya").value);
      let tambahan = Number(document.getElementById("tambahan").value);

      if (modal <= 0 || harga <= 0 || biaya < 0 || biaya > 100 || tambahan < 0) {
        document.getElementById("hasil").innerText =
          "Masukkan angka yang benar pada semua kolom.";
        return;
      }

      let biayaPlatform = harga * biaya / 100;
      let untung = harga - modal - biayaPlatform - tambahan;

      document.getElementById("hasil").innerHTML =
        "Modal: " + rupiah(modal) + "<br>" +
        "Biaya platform: " + rupiah(biayaPlatform) + "<br>" +
        "Biaya tambahan: " + rupiah(tambahan) + "<br>" +
        "<strong>Perkiraan keuntungan: " + rupiah(untung) + "</strong>";
    }

    function rupiah(angka) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(angka);
    }
    function bandingkanProduk() {
  let nama = document.getElementById("namaProduk").value;
  let modal = Number(document.getElementById("modalBanding").value);
  let harga = Number(document.getElementById("hargaBanding").value);
  let biaya = Number(document.getElementById("biayaBanding").value);
  let tambahan = Number(document.getElementById("tambahanBanding").value);

  if (nama.trim() === "" || modal <= 0 || harga <= 0 || biaya < 0 || biaya > 100 || tambahan < 0) {
    document.getElementById("hasilBanding").innerText =
      "Isi semua kolom dengan data yang benar.";
    return;
  }

  let biayaPlatform = harga * biaya / 100;
  let untung = harga - modal - biayaPlatform - tambahan;

  let hasil = document.getElementById("hasilBanding");
  let data = JSON.parse(hasil.dataset.produk || "[]");

  data.push({
    nama: nama,
    untung: untung
  });

  data.sort((a, b) => b.untung - a.untung);
  hasil.dataset.produk = JSON.stringify(data);

  hasil.innerHTML = "<strong>Perbandingan keuntungan:</strong><br>" +
    data.map((p, i) =>
      (i + 1) + ". " + p.nama + " — " +
      rupiah(p.untung)
    ).join("<br>");
             }
    const dataStokTersimpan = localStorage.getItem("rafaStok");

const produkStok = dataStokTersimpan
  ? JSON.parse(dataStokTersimpan)
  : [
      { nama: "Jaket", stok: 12 },
      { nama: "Kaos", stok: 2 },
      { nama: "Sepatu", stok: 1 },
      { nama: "Tas", stok: 8 }
    ];
    
let riwayatStok = JSON.parse(
  localStorage.getItem("riwayatStok")
) || [];
    
function tampilkanStok() {
  
const tempat = document.getElementById("daftarStok");
const pilihan = document.getElementById("pilihProduk");

const pilihanSebelumnya = localStorage.getItem("pilihanProduk");

pilihan.innerHTML = "";

produkStok.forEach(function(item, index) {
  pilihan.innerHTML +=
    `<option value="${index}">${item.nama}</option>`;
});

if (
  pilihanSebelumnya !== null &&
  produkStok[Number(pilihanSebelumnya)]
) {
  pilihan.value = pilihanSebelumnya;
}

pilihan.addEventListener("change", function() {
  localStorage.setItem("pilihanProduk", pilihan.value);
});
    

const stokMenipis = [];

tempat.innerHTML = "";

const kolomCari = document.getElementById("cariProduk");
const kataCari = kolomCari.value.toLowerCase().trim();

produkStok.forEach(function(item) {
  if (item.nama.toLowerCase().includes(kataCari)) {
    tempat.innerHTML +=
      `<p>${item.nama} — Stok: ${item.stok}</p>`;
  }

  if (item.stok <= 2) {
    stokMenipis.push(item);
  }
});
  
  
  tempat.innerHTML += "<h3>⚠️ Peringatan Stok Menipis</h3>";

  stokMenipis.forEach(function(item) {
    tempat.innerHTML +=
      `<p>${item.nama} — Stok tersisa ${item.stok}!</p>`;
  });

const tempatRiwayat = document.getElementById("riwayatStok");
tempatRiwayat.innerHTML = "";

riwayatStok.forEach(function(transaksi) {
  tempatRiwayat.innerHTML +=
    `<p>${transaksi.waktu} — ${transaksi.nama} — ${transaksi.jenis} — ${transaksi.jumlah} barang</p>`;
});
  
}

document.getElementById("cariProduk").addEventListener("input", function() {
  tampilkanStok();
});
            
tampilkanStok();
  
   
function prosesStok() {
  const pilihan = document.getElementById("pilihProduk");
  const jenis = document.getElementById("jenisTransaksi").value;
  const jumlah = Number(document.getElementById("jumlahStok").value);
  const index = Number(pilihan.value);
  const item = produkStok[index];
  if (!item) {
  alert("Produk tidak ditemukan!");
  return;
  }
  
if (
  !Number.isInteger(jumlah) ||
  jumlah < 1
) {
  alert("Masukkan jumlah barang bulat yang benar!");
  return;
}
  

  if (jenis === "masuk") {
    item.stok += jumlah;
  } else {
    if (jumlah > item.stok) {
      alert("Stok tidak cukup!");
      return;
    }

    item.stok -= jumlah;
  }
riwayatStok.push({
  nama: item.nama,
  jenis: jenis,
  jumlah: jumlah,
  waktu: new Date().toLocaleString("id-ID")
});

localStorage.setItem(
  "riwayatStok",
  JSON.stringify(riwayatStok)
);
  document.getElementById("jumlahStok").value = "";
  
localStorage.setItem(
  "rafaStok",
  JSON.stringify(produkStok)
);
  tampilkanStok();
  alert("Transaksi stok berhasil!");
}
    
        
  </script>
</body>
</html>
